<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sinking into soft ground | M1 animations</title>
  <link rel="stylesheet" href="../../static/style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="../../">All examples</a>
    <p class="chapter">Chapter 4: Momentum</p>
    <h1>Sinking into soft ground</h1>
    <noscript><p class="blurb">This page needs JavaScript to draw the animation.</p></noscript>
  </header>
  <main class="layout">
    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="stage" role="img" aria-label="Animation: Sinking into soft ground"></canvas>
        <p id="loading" class="loading" hidden>Loading…</p>
      </div>
      <div class="readout-strip" hidden>
        <dl id="readout"></dl>
      </div>
      <div class="controls">
        <button id="load" type="button" class="quiet" title="Reload the whole page">Load</button>
        <button id="play" type="button">Play</button>
        <button id="restart" type="button" class="quiet">Restart</button>
        <label class="speed">Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Scrub through the animation">
        <p class="keys">Space: play / pause · R: restart · ← →: step one frame (Shift for 10) · Load: reload the page</p>
      </div>
    </section>
    <section class="panel">
      <h2>Calculated values</h2>
      <dl id="results"></dl>
      <h2>Your numbers</h2>
      <form id="params" autocomplete="off" onsubmit="return false">
        
        <label>
          <span>Mass <em>(kg)</em></span>
          
          <input name="m" type="number" step="any" inputmode="decimal" value="2">
          
          
        </label>
        
        <label>
          <span>Height it falls from <em>(m)</em></span>
          
          <input name="h" type="number" step="any" inputmode="decimal" value="5">
          
          
        </label>
        
        <label>
          <span>Depth it sinks into the ground <em>(m)</em></span>
          
          <input name="depth" type="number" step="any" inputmode="decimal" value="0.15">
          
          
        </label>
        
        <label>
          <span>Gravity g <em>(m/s²)</em></span>
          
          <input name="g" type="number" step="any" inputmode="decimal" value="9.8">
          
          
        </label>
        
      </form>
      <p id="error" role="alert"></p>
      
      <h2>Other examples</h2>
      <ul class="presets">
        
        <li><a href="../../e/soft-ground-1/">2 kg falls 5 m and sinks 15 cm</a></li>
        
        <li><a href="../../e/soft-ground-2/">Pile driver: 500 kg falls 2.5 m, sinks 0.1 m</a></li>
        
      </ul>
      
    </section>
  </main>
  <script>window.SCENE_ID = "soft-ground";</script>
  <script src="../../static/solvers.js"></script>
  <script src="../../static/catalog.js"></script>
  <script src="../../static/scenes.js"></script>
  <script src="../../static/app.js"></script>
</body>
</html>
