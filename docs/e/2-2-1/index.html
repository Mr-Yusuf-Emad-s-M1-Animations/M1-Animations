<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle on two strings | M1 animations</title>
  <link rel="stylesheet" href="../../static/style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="../../">All examples</a>
    <p class="chapter">Chapter 2: Statics</p>
    <h1>Particle on two strings</h1>
    <noscript><p class="blurb">This page needs JavaScript to draw the animation.</p></noscript>
  </header>
  <main class="layout">
    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="stage" role="img" aria-label="Animation: Particle on two strings"></canvas>
        <p id="loading" class="loading" hidden>Loading…</p>
      </div>
      <div class="readout-strip" hidden>
        <dl id="readout"></dl>
      </div>
      <div class="controls">
        <button id="load" type="button" class="quiet" title="Reload the whole page">Load</button>
        <button id="play" type="button">Play</button>
        <button id="restart" type="button" class="quiet">Restart</button>
        <label class="speed">Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Scrub through the animation">
        <p class="keys">Space: play / pause · R: restart · ← →: step one frame (Shift for 10) · Load: reload the page</p>
      </div>
    </section>
    <section class="panel">
      <h2>Calculated values</h2>
      <dl id="results"></dl>
      <h2>Your numbers</h2>
      <form id="params" autocomplete="off" onsubmit="return false">
        
        <label>
          <span>Weight W <em>(N)</em></span>
          
          <input name="W" type="number" step="any" inputmode="decimal" value="29.4">
          
          
        </label>
        
        <label>
          <span>Angle of AC to the horizontal <em>(°)</em></span>
          
          <input name="alpha" type="number" step="any" inputmode="decimal" value="60">
          
          
        </label>
        
        <label class="wide">
          <span>Angle of BC (or the force) to the horizontal <em>(°)</em></span>
          
          <input name="beta" type="number" step="any" inputmode="decimal" value="20">
          
          
        </label>
        
        <label class="wide">
          <span>The pull on the right is</span>
          
          <select name="second">
            
            <option value="string" >a string BC</option>
            
            <option value="force" selected>a force F</option>
            
          </select>
          
        </label>
        
      </form>
      <p id="error" role="alert"></p>
      
      <h2>Other examples</h2>
      <ul class="presets">
        
        <li><a href="../../e/hanging-strings-1/">Strings at 30° and 45°</a></li>
        
        <li><a href="../../e/hanging-strings-2/">Symmetric strings at 60°</a></li>
        
        <li><a href="../../e/hanging-strings-3/">String and a force F</a></li>
        
      </ul>
      
    </section>
  </main>
  <script>window.SCENE_ID = "hanging-strings";</script>
  <script src="../../static/solvers.js"></script>
  <script src="../../static/catalog.js"></script>
  <script src="../../static/scenes.js"></script>
  <script src="../../static/app.js"></script>
</body>
</html>
